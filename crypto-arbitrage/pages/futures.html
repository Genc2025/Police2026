</style></head><body><div class="w"><div class="top"><div><h1>SOLUSDT • 10 Method Race</h1><div class="sub">10 metoda live njëkohësisht • secila nis me 100 USDT virtuale</div></div><div><div id="clock" class="clock">00:00:00</div><div id="st" class="st">Connecting…</div></div></div><div id="lead" class="lead">Waiting for SOL data…</div><div id="grid" class="grid"></div><div class="foot">Paper only • 0.05% taker fee për anë • live bid/ask spread • 120ms entry • 100ms exit • të njëjtat kosto për të 10 metodat • entry gate i kalibruar për hold 0–180s.</div></div><script>
(()=>{'use strict';

const $=x=>document.getElementById(x),sg=x=>x>0?1:x<0?-1:0,cl=x=>Math.max(-1,Math.min(1,x)),fmt=x=>(+x).toFixed(3),tm=ms=>{let s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60);return[h,m,s%60].map(x=>String(x).padStart(2,'0')).join(':')};
let b={bid:0,ask:0,bq:0,aq:0},mark=0,ph=[],th=[],health={b:0,t:0,m:0,lb:0,lt:0,lm:0},ws1=null,ws2=null,busy=false,last=Date.now();

function fresh(){return{ms:0,s:Object.fromEntries(M.map(x=>[x[0],ns(x[0])]))}}function load(){try{let x=JSON.parse(localStorage.getItem(K));if(x&&x.s){for(const m of M)if(!x.s[m[0]])x.s[m[0]]=ns(m[0]);x.ms=+x.ms||0;return x}}catch(e){}return fresh()}let A=load();function save(){try{localStorage.setItem(K,JSON.stringify(A))}catch(e){}}
function price(t,p){if(!(p>0))return;ph.push([t,p]);while(ph.length&&ph[0][0]<t-20000)ph.shift()}function old(sec,n){let z=n-sec*1000;for(let i=ph.length-1;i>=0;i--)if(ph[i][0]<=z)return ph[i][1];return 0}function ret(sec,n,p){let q=old(sec,n);return q?p/q-1:0}function flow(sec,n){let s=0,a=0,c=n-sec*1000;for(let i=th.length-1;i>=0;i--){if(th[i][0]<c)break;s+=th[i][1];a+=Math.abs(th[i][1])}return a?s/a:0}function vol(n){let v=[],l=-1e9;for(const x of ph){if(n-x[0]>10000)continue;if(x[0]-l>300){v.push(x);l=x[0]}}if(v.length<6)return .0003;let r=[];for(let i=1;i<v.length;i++)r.push(Math.log(v[i][1]/v[i-1][1]));let m=r.reduce((a,b)=>a+b,0)/r.length;return Math.max(.00007,Math.sqrt(r.reduce((a,x)=>a+(x-m)**2,0)/r.length))}function ready(){let n=Date.now(),span=ph.length?n-ph[0][0]:0;return n-health.lb<1500&&n-health.lt<1500&&n-health.lm<3000&&span>5200&&th.length>5}
function base(){if(!(b.bid>0&&b.ask>b.bid))return 0;let n=Date.now(),mid=(b.bid+b.ask)/2,sp=(b.ask-b.bid)/mid;if(sp>MAXSP)return 0;let q=b.bq+b.aq,book=q?(b.bq-b.aq)/q:0,mp=q?(b.ask*b.bq+b.bid*b.aq)/q:mid,v=vol(n),o=old(.25,n),micro=o?Math.tanh((mp/o-1)/Math.max(v*.7,.00006)):0,r05=ret(.5,n,mid),r2=ret(2,n,mid),r5=ret(5,n,mid),bas=mark?mid/mark-1:0,f={book:cl(book),micro:cl(micro),f1:cl(flow(1,n)),f5:cl(flow(5,n)),m05:Math.tanh(r05/Math.max(v*.9,.00008)),m2:Math.tanh(r2/Math.max(v*1.8,.00016)),m5:Math.tanh(r5/Math.max(v*3,.00028)),basis:Math.tanh(bas/.00045)},trend=f.m2*f.f1>0&&Math.abs(f.m2)>.25&&Math.abs(f.f1)>.18,shock=Math.abs(r05)>Math.max(v*2.6,.00035)&&Math.abs(f.f1)<.35;return{f,v,r05,r2,r5,reg:shock?'mean_revert':trend?'trend':'mixed',cost:2*F+sp+BUF,ok:ready()}}
function evalm(x,c){let f=x.f,k=c[2],sc=0,ok=1,dir=1;if(k==='contrarian'){sc=(.8*f.book+.85*f.micro+1.2*f.f1+.95*f.f5+.8*f.m05+f.m2+.75*f.m5-.25*f.basis)/6.6;ok=x.reg!=='trend';dir=-1}else if(k==='trend'){sc=(.35*f.book+.65*f.micro+1.05*f.f1+1.1*f.f5+.75*f.m05+1.35*f.m2+1.45*f.m5)/6.7;ok=x.reg!=='mean_revert'&&sg(f.m2)===sg(sc);dir=1}else if(k==='book'){sc=(1.85*f.book+1.45*f.micro+.45*f.f1+.35*f.m05)/4.1;ok=Math.abs(f.book)>.52&&sg(f.book)===sg(sc);dir=1}else if(k==='flow'){sc=(1.9*f.f1+1.55*f.f5+.7*f.m05+.55*f.m2)/4.7;ok=Math.abs(f.f1)>.28&&sg(f.f1)===sg(sc);dir=1}else if(k==='micro'){sc=(2.05*f.micro+f.book+f.m05+.55*f.f1)/4.6;ok=Math.abs(f.micro)>.35&&sg(f.micro)===sg(sc);dir=1}else if(k==='mtf'){sc=(.9*f.m05+1.65*f.m2+1.9*f.m5+.55*f.f1)/5;ok=Math.abs(f.m2)>.35&&sg(f.m05)===sg(sc)&&sg(f.m2)===sg(sc)&&sg(f.m5)===sg(sc);dir=1}else if(k==='shock'){sc=(1.95*f.m05+f.m2+.9*f.micro+.35*f.f1)/4.2;ok=x.reg==='mean_revert'&&Math.abs(f.m05)>.55;dir=-1}else if(k==='consensus'){sc=(f.book+.8*f.micro+1.25*f.f1+.8*f.f5+.7*f.m05+f.m2+.65*f.m5)/6.2;ok=[f.book,f.micro,f.f1,f.m05,f.m2].filter(z=>sg(z)===sg(sc)).length>=4;dir=1}else if(k==='basis'){sc=(2.2*f.basis+.55*f.m05+.45*f.m2+.45*f.micro+.25*f.f1)/3.9;ok=Math.abs(f.basis)>.28;dir=-1}else{sc=(.7*f.book+.85*f.micro+1.05*f.f1+.85*f.f5+.8*f.m05+1.1*f.m2+.85*f.m5-.1*f.basis)/6.3;ok=1;dir=x.reg==='trend'?1:-1}sc=cl(sc);let horizonMove=Math.max(Math.abs(x.r5)*1.15,Math.abs(x.r2)*1.65,x.v*10),edge=Math.abs(sc)*horizonMove,conf=1/(1+Math.exp(-(Math.abs(sc)-.38)*8)),marketRoom=horizonMove>=x.cost*.65;ok=ok&&x.ok&&Math.abs(sc)>=c[3]&&conf>=.58&&marketRoom;let side=sc>0?'LONG':'SHORT';if(dir<0)side=side==='LONG'?'SHORT':'LONG';return{ok,sc,side,edge,v:x.v,horizonMove,marketRoom}}
function u(st){let p=st.pos;if(!p)return 0;let px=p.side==='LONG'?b.bid:b.ask,g=p.side==='LONG'?p.q*(px-p.e):p.q*(p.e-px);return g-p.f-p.q*px*F}function eq(st){return st.bal+u(st)}function nr(p){let x=p.side==='LONG'?b.bid:b.ask,g=p.side==='LONG'?x/p.e-1:(p.e-x)/p.e;return g-F-(x/p.e)*F}
function open(st,c,a){if(!a.ok||st.pos||st.pe||Date.now()<st.cd)return;const id=c[0],tmr=timers[id],gen=tmr.generation;st.pe=1;st.attempts=(st.attempts||0)+1;let side=a.side;tmr.entry=setTimeout(()=>{tmr.entry=0;if(tmr.generation!==gen||A.s[id]!==st)return;st.pe=0;let x=base(),z=x&&evalm(x,c);if(!z||!z.ok||z.side!==side||st.pos)return;let e=side==='LONG'?b.ask:b.bid,av=side==='LONG'?b.aq:b.bq,q=(Math.max(1,eq(st))/3)/e;if(!(q>0&&q<=av))return;let stop=Math.max(.0012,Math.min(.0022,z.v*5+F*.4)),tar=Math.max(stop*c[4],.0017,Math.min(.0045,z.v*12+z.edge*.6));st.pos={side,e,q,f:q*e*F,t:Date.now(),stop,tar};save()},EL)}function close(st,c){if(st.pc||!st.pos)return;const id=c[0],tmr=timers[id],gen=tmr.generation;st.pc=1;tmr.exit=setTimeout(()=>{tmr.exit=0;if(tmr.generation!==gen||A.s[id]!==st)return;st.pc=0;let p=st.pos;if(!p)return;let x=p.side==='LONG'?b.bid:b.ask,g=p.side==='LONG'?p.q*(x-p.e):p.q*(p.e-x),net=g-p.f-p.q*x*F;st.bal+=net;net>0?st.w++:st.l++;st.pos=0;st.cd=Date.now()+18000;save()},XL)}function run(st,c,a){if(!st.pos){open(st,c,a);return}let p=st.pos,z=nr(p),held=Date.now()-p.t;if(z>=p.tar||z<=-p.stop||held>180000)close(st,c)}

function market(){if(ws1&&ws1.readyState<2)return;let w=new WebSocket('wss://fstream.binance.com/stream?streams=solusdt@bookTicker/solusdt@trade');ws1=w;w.onmessage=e=>{try{let d=(JSON.parse(e.data).data||{}),t=Date.now();if(d.e==='trade'){let p=+d.p,q=+d.q;if(p>0&&q>0){th.push([t,p*q*(d.m?-1:1)]);while(th.length&&th[0][0]<t-10000)th.shift();health.t++;health.lt=t;price(t,p)}}else{let bi=+d.b,as=+d.a,bq=+d.B,aq=+d.A;if(bi>0&&as>bi){b={bid:bi,ask:as,bq,aq};health.b++;health.lb=t;price(t,(bi+as)/2)}}}catch(_){}};w.onclose=()=>{ws1=0;setTimeout(connect,1200)};w.onerror=()=>w.close()}function marks(){if(ws2&&ws2.readyState<2)return;let w=new WebSocket('wss://fstream.binance.com/stream?streams=!markPrice@arr@1s');ws2=w;w.onmessage=e=>{try{let a=JSON.parse(e.data).data||[],t=Date.now();for(const x of a)if(x.s===S&&+x.p>0){mark=+x.p;health.m++;health.lm=t}}catch(_){}};w.onclose=()=>{ws2=0;setTimeout(connect,1200)};w.onerror=()=>w.close()}async function rest(){if(busy||document.visibilityState!=='visible'||Date.now()-health.lm<2500)return;busy=1;try{let r=await fetch('https://fapi.binance.com/fapi/v1/premiumIndex?symbol=SOLUSDT',{cache:'no-store'}),x=await r.json();if(+x.markPrice>0){mark=+x.markPrice;health.m++;health.lm=Date.now()}}catch(_){}busy=0}function connect(){market();marks()}

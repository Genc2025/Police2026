name: Crypto Paper Stopper

on:
  push:
    branches: ["claude/html-demo-rn-app-jz85o7"]
    paths:
      - ".github/workflows/crypto-paper-6h.yml"

permissions:
  contents: read

concurrency:
  group: crypto-paper-6h
  cancel-in-progress: true

jobs:
  stopper:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel existing crypto paper run by concurrency replacement
        run: echo "Stopping previous crypto-paper-6h run"

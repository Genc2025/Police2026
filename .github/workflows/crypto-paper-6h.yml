name: Crypto Paper 6h

on:
  schedule:
    - cron: '7 */6 * * *'
  workflow_dispatch:
  push:
    branches: ["claude/html-demo-rn-app-jz85o7"]
    paths:
      - "crypto-arbitrage/cross_exchange_runner.py"
      - ".github/workflows/crypto-paper-6h.yml"

permissions:
  contents: write

concurrency:
  group: crypto-paper-6h
  cancel-in-progress: true

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/html-demo-rn-app-jz85o7
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install websocket client
        run: python -m pip install 'websockets>=14,<16'
      - name: Validate cross-exchange paper engine
        run: python -m py_compile crypto-arbitrage/cross_exchange_runner.py
      - name: Configure state commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Run cross-exchange paper engine for 5h40m
        env:
          PAPER_RUNTIME_SECONDS: '20400'
          PAPER_SAVE_INTERVAL_SECONDS: '300'
          PAPER_MAX_NOTIONAL: '100'
          PAPER_MIN_SIGNAL: '0.01'
          PAPER_MIN_FILL: '0.005'
          PAPER_EXEC_DELAY: '0.350'
          PAPER_MAX_QUOTE_AGE: '2.0'
          PAPER_MAX_SKEW: '0.75'
        run: python crypto-arbitrage/cross_exchange_runner.py

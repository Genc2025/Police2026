name: crypto-arbitrage-v1

on:
  push:
    branches:
      - crypto-arbitrage-v1
    paths:
      - 'crypto-arbitrage/**'
      - '.github/workflows/crypto-arbitrage-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r crypto-arbitrage/requirements.txt

      - name: Unit tests
        run: pytest -q crypto-arbitrage/tests

      - name: Live USDT market discovery
        run: python crypto-arbitrage/market_probe.py --quote USDT --assets BTC ETH SOL XRP ADA LINK DOGE AVAX

      - name: Realtime USDT WebSocket smoke test
        run: python crypto-arbitrage/realtime.py --seconds 12

      - name: Cross-exchange USDT paper sample
        run: python crypto-arbitrage/scanner.py --cycles 10

      - name: Binance USDT triangular paper sample
        run: python crypto-arbitrage/triangular.py --cycles 10

      - name: Combined USDT paper report
        run: python crypto-arbitrage/report.py | tee crypto-arbitrage/paper-report.txt

      - name: Dashboard API and UI smoke test
        run: |
          python crypto-arbitrage/dashboard_server.py --host 127.0.0.1 --port 8080 > /tmp/arbitrage-dashboard.log 2>&1 &
          DASH_PID=$!
          trap 'kill $DASH_PID || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8080/api/summary > /tmp/summary.json; then break; fi
            sleep 0.25
          done
          grep -q '"mode":"PAPER"' /tmp/summary.json
          grep -q '"capital_asset":"USDT"' /tmp/summary.json
          curl -fsS http://127.0.0.1:8080/api/trades?limit=20 > /tmp/trades.json
          curl -fsS http://127.0.0.1:8080/api/opportunities?limit=20 > /tmp/opportunities.json
          curl -fsS http://127.0.0.1:8080/ | grep -q 'Trading Monitor'

      - name: Upload paper evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-arbitrage-usdt-paper-snapshot
          path: |
            crypto-arbitrage/paper_arbitrage_usdt.db
            crypto-arbitrage/paper-report.txt
          if-no-files-found: warn
          retention-days: 14

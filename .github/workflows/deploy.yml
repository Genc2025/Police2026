name: Deploy Police2026
on:
  push:
    branches: ["claude/html-demo-rn-app-jz85o7"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - name: Add crypto dashboard subpage
        run: |
          mkdir -p dist/crypto
          cp -R crypto-arbitrage/pages/. dist/crypto/
      - name: Expand crypto dashboard to 18 USDT pairs
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('dist/crypto/index.html')
          s = p.read_text()
          s = s.replace(
              "const CROSS_PAIRS=['BTC/USDT','ETH/USDT','SOL/USDT','XRP/USDT','ADA/USDT','LINK/USDT','DOGE/USDT','AVAX/USDT'];",
              "const CROSS_PAIRS=['BTC/USDT','ETH/USDT','SOL/USDT','XRP/USDT','ADA/USDT','LINK/USDT','DOGE/USDT','AVAX/USDT','BCH/USDT','LTC/USDT','DOT/USDT','UNI/USDT','AAVE/USDT','NEAR/USDT','ATOM/USDT','SUI/USDT','SHIB/USDT','HBAR/USDT'];"
          )
          s = s.replace(
              "const krPairs=['ETH/USDT','SOL/USDT','XRP/USDT','ADA/USDT','LINK/USDT','AVAX/USDT'];",
              "const krPairs=['ETH/USDT','SOL/USDT','XRP/USDT','ADA/USDT','LINK/USDT','AVAX/USDT','BCH/USDT','LTC/USDT','DOT/USDT','UNI/USDT','AAVE/USDT','NEAR/USDT','ATOM/USDT','SUI/USDT','SHIB/USDT','HBAR/USDT'];"
          )
          p.write_text(s)
          PY
      - name: Compact crypto dashboard for phones
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('dist/crypto/index.html')
          s = p.read_text()
          css = r'''<style>
          @media(max-width:760px){
            .wrap{padding:8px}.top{gap:7px}.title{font-size:18px}.sub{font-size:10.5px;line-height:1.3;margin-top:3px}
            .controls{width:100%;justify-content:space-between}.badge,.btn{padding:6px 8px;font-size:10.5px}
            .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin:9px 0}.card{padding:9px;border-radius:10px}.k{font-size:10px}.v{font-size:16px;margin-top:3px}
            .section{margin-top:12px}.section h2{font-size:14px;margin-bottom:6px}.desc{display:none}.tablebox{border-radius:10px;overflow:hidden}
            table{min-width:0!important;width:100%;table-layout:fixed}th,td{padding:7px 5px;font-size:10.5px;white-space:normal;overflow-wrap:anywhere;line-height:1.25}th{font-size:9px;letter-spacing:.02em}.status{font-size:9px;padding:3px 5px}
            #triangles{ }#triangles tr td:nth-child(2),#triangles tr td:nth-child(5),#triangles tr td:nth-child(6){display:none}
            #triangles~*{display:none}
            table:has(#triangles) th:nth-child(2),table:has(#triangles) th:nth-child(5),table:has(#triangles) th:nth-child(6){display:none}
            table:has(#triangles) th:nth-child(1),table:has(#triangles) td:nth-child(1){width:42%}table:has(#triangles) th:nth-child(3),table:has(#triangles) td:nth-child(3){width:20%}table:has(#triangles) th:nth-child(4),table:has(#triangles) td:nth-child(4){width:24%}table:has(#triangles) th:nth-child(7),table:has(#triangles) td:nth-child(7){width:14%}
            table:has(#history) th:nth-child(3),table:has(#history) td:nth-child(3),table:has(#history) th:nth-child(4),table:has(#history) td:nth-child(4),table:has(#history) th:nth-child(6),table:has(#history) td:nth-child(6){display:none}
            table:has(#history) th:nth-child(1),table:has(#history) td:nth-child(1){width:18%}table:has(#history) th:nth-child(2),table:has(#history) td:nth-child(2){width:43%}table:has(#history) th:nth-child(5),table:has(#history) td:nth-child(5){width:23%}table:has(#history) th:nth-child(7),table:has(#history) td:nth-child(7){width:16%}
            table:has(#routes) th:nth-child(3),table:has(#routes) td:nth-child(3),table:has(#routes) th:nth-child(5),table:has(#routes) td:nth-child(5),table:has(#routes) th:nth-child(6),table:has(#routes) td:nth-child(6),table:has(#routes) th:nth-child(7),table:has(#routes) td:nth-child(7){display:none}
            table:has(#routes) th:nth-child(1),table:has(#routes) td:nth-child(1){width:22%}table:has(#routes) th:nth-child(2),table:has(#routes) td:nth-child(2){width:20%}table:has(#routes) th:nth-child(4),table:has(#routes) td:nth-child(4){width:20%}table:has(#routes) th:nth-child(8),table:has(#routes) td:nth-child(8){width:24%}table:has(#routes) th:nth-child(9),table:has(#routes) td:nth-child(9){width:14%}
            table:has(#quotes) th:nth-child(5),table:has(#quotes) td:nth-child(5){display:none}table:has(#quotes) th,table:has(#quotes) td{width:25%}
            .sources{display:none}.note{font-size:9.5px;padding:8px;margin-top:9px;line-height:1.35}
          }
          </style>'''
          s = s.replace('</head>', css + '\n</head>')
          p.write_text(s)
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
